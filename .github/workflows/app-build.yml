name: App build

on:
  push:
    branches: [main]
    paths:
      - "Tokenometer/**"
      - "TokenometerWidget/**"
      - "TokenometerCore/**"
      - "Tokenometer.xcodeproj/**"
      - "project.yml"
      - ".github/workflows/app-build.yml"
  pull_request:
    paths:
      - "Tokenometer/**"
      - "TokenometerWidget/**"
      - "TokenometerCore/**"
      - "Tokenometer.xcodeproj/**"
      - "project.yml"
      - ".github/workflows/app-build.yml"

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)
          [ -n "$xcode" ] && sudo xcode-select -s "$xcode"
          version=$(xcodebuild -version | head -n 1)
          case "$version" in
            "Xcode 27"*) echo "$version at $(xcode-select -p)" ;;
            *)
              echo "::error::Need Xcode 27, runner has ${version:-no Xcode}. Installed:"
              ls -d /Applications/Xcode*.app
              exit 1 ;;
          esac
      # Unsigned: CI has no Developer ID identity. Builds the app and, as its
      # dependency, the widget extension.
      - name: Build app and widget
        run: |
          xcodebuild -project Tokenometer.xcodeproj -scheme Tokenometer \
            -configuration Debug -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
