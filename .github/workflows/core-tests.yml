name: Core tests

on:
  push:
    branches: [main]
    paths: ["TokenometerCore/**", ".github/workflows/core-tests.yml"]
  pull_request:
    paths: ["TokenometerCore/**", ".github/workflows/core-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)
          [ -n "$xcode" ] && sudo xcode-select -s "$xcode"
          version=$(xcodebuild -version | head -n 1)
          case "$version" in
            "Xcode 27"*) echo "$version at $(xcode-select -p)" ;;
            *)
              echo "::error::Need Xcode 27, runner has ${version:-no Xcode}. Installed:"
              ls -d /Applications/Xcode*.app
              exit 1 ;;
          esac
      - name: Run tests
        working-directory: TokenometerCore
        run: swift test
