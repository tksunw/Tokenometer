name: Core tests

on:
  push:
    branches: [main]
    paths: ["TokenometerCore/**", ".github/workflows/core-tests.yml"]
  pull_request:
    paths: ["TokenometerCore/**"]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.0.app || ls /Applications | grep Xcode
      - name: Run tests
        working-directory: TokenometerCore
        run: swift test
