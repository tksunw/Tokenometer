name: Core tests

on:
  push:
    branches: [main]
    paths: ["TokenometerCore/**", ".github/workflows/core-tests.yml"]
  pull_request:
    paths: ["TokenometerCore/**", ".github/workflows/core-tests.yml"]

jobs:
  test:
    runs-on: macos-27
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 27 on this runner. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
      - name: Run tests
        working-directory: TokenometerCore
        run: swift test
